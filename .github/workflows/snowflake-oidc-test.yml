name: Snowflake OIDC connection test

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Snowflake account tier
        type: choice
        required: true
        default: nonprod
        options:
          - nonprod
          - prod
      stage:
        description: Nonprod stage (or prod deployment stage)
        type: choice
        required: true
        default: dev
        options:
          - dev
          - sit
          - test
          - perf

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    environment: ${{ inputs.tier }}-${{ inputs.stage }}
    permissions:
      id-token: write
      contents: read
    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Snowflake connector
        run: python -m pip install snowflake-connector-python

      - name: Test Snowflake OIDC connection
        run: python scripts/test_snowflake_oidc.py
